plugins:
  - name: jwt
    service: spring
    config:
      claims_to_verify: 
        - exp

  - name: jwt-headers-transformer
    service: spring

  - name: request-transformer
    service: spring
    config:
      replace:
        uri: "/api/$(uri_captures['paths'])"
        # headers:
        #   - "Host:trackio.amisahdev.com.br"
        #   - "X-Forwarded-Proto:https"
  
  - name: cors
    service: spring
    config:
      origins:
        - http://localhost:4200
        - https://trackadmin.amisahdev.com.br
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - X-User-Id
        - X-Username
        - X-Full-name
        - X-Email
      credentials: true
      max_age: 3600


  - name: rate-limiting
    service: spring
    config:
      minute: 100
      policy: local
      limit_by: ip
