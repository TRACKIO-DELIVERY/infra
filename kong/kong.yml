_format_version: "3.0"
_transform: true

services:
- name: keycloak
  url: http://keycloak:8080
  routes:
  - name: keycloak
    hosts:
      - auth.amisahdev.com.br
    paths:
      - /
    strip_path: false
    
- name: spring
  url: http://order-spring:5000
  routes:
  - name: spring
    hosts:
      - trackio.amisahdev.com.br
    paths:
      - ~/api/order-service/(?<paths>.*)
    protocols:
      - http
      - https
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    strip_path: false
    path_handling: v1
  
- name: tracking-server
  url: http://tracking:3333
  routes:
  - name: tracking-server
    paths:
      - /track
    hosts:
      - trackio.amisahdev.com.br
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - HEAD
    strip_path: false

- name: grafana
  url: http://grafana:3000
  routes:
  - name: grafana
    paths:
      - /grafana
      - /grafana/
      - ~/grafana/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - HEAD
    strip_path: false
    path_handling: v1

- name: loki
  url: http://loki:3100
  routes:
    - name: loki
      paths:
        - /loki
        - ~/loki/*
      methods:
        - GET
        - POST
      strip_path: false
      path_handling: v1

- name: prometheus
  url: http://prometheus:9090
  routes:
    - name: prometheus
      paths:
        - /prometheus
        - ~/prometheus/*
      methods:
        - GET
        - POST
      strip_path: true
      path_handling: v1

- name: mailpit
  url: http://mailpit:8025
  routes:
    - name: mailpit-prefix-route
      hosts:
      - mailpit.amisahdev.com.br
      protocols:
        - http
        - https
      paths:
        - /
        - /*
      strip_path: false

    - name: mailpit-dist-route
      hosts:
        - mailpit.amisahdev.com.br
      paths:
        - /dist
        - /dist/
      strip_path: false


