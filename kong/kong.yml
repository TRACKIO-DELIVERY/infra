plugins:
  - name: jwt
    service: spring
    config:
      claims_to_verify: 
        - exp

  - name: jwt-headers-transformer
    service: spring

  - name: request-transformer
    service: spring
    config:
      replace:
        uri: "/api/$(uri_captures['paths'])"
        # headers:
        #   - "Host:trackio.amisahdev.com.br"
        #   - "X-Forwarded-Proto:https"
  
  - name: cors
    config:
      origins:
        - http://localhost:4200
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - X-User-Id
        - X-Username
      credentials: true
      max_age: 3600


